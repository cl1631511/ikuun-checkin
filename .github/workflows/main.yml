name: 'kunkun Checkin Action'

on: 
  release:
    types: [published]
  push:
    tags:
    - 'v*'
  schedule:
    - cron: '0 16 * * *'
  watch:
    types: [started]
  workflow_dispatch:
   
jobs:
  checking:
    runs-on: ubuntu-latest
    env:
      DOMAIN: https://ikuuu.fyi
    if: github.event.repository.owner.id == github.event.sender.id || github.event_name == 'schedule'
    steps:
    - name: Setup timezone
      uses: zcong1993/setup-timezone@master
      with:
        timezone: Asia/Shanghai          
    - name: Get log
      uses: actions/checkout@master
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install Playwright
      run: |
        npm install playwright-extra puppeteer-extra-plugin-stealth playwright
        npx playwright install chromium --with-deps
    - name: login in APi # 登录获取cookie + 签到 + Bark推送
      env:
        EMAIL: ${{ secrets.EMAIL }}
        PASSWORD: ${{ secrets.PASSWORD }}
        BARK_KEY: ${{ secrets.BARK_KEY }}   #  新增：传递 Bark 密钥
      run: xvfb-run --auto-servernum node login.js
    - name: Chick in Api # 签到（保留原有逻辑作为备用）
      env:
        SENDKEY: ${{ secrets.SENDKEY }}
      run: | 
        dateTime=`date +%Y-%m-%d\ %H:%M:%S`
        response=$(curl -b cookie.txt -X POST "$DOMAIN/user/checkin")
        # 如果 SENDKEY 存在，通过 Server酱 发送通知
        if [ -n "$SENDKEY" ]; then
          curl -X POST "https://sctapi.ftqq.com/${SENDKEY}.send" -d "title=${response}&desp=${response}" 
        fi
        echo "$dateTime - $(echo -e $response)" >> run.log
        tail run.log
    - name: Bark Notification #  新增：独立的 Bark 推送步骤（备用）
      if: always()  # 即使前面的步骤失败也运行
      env:
        BARK_KEY: ${{ secrets.BARK_KEY }}
      run: |
        if [ -z "$BARK_KEY" ]; then
          echo " 未设置 BARK_KEY，跳过 Bark 推送"
          exit 0
        fi
        
        # 从 run.log 中提取签到结果
        if [ -f run.log ]; then
          RESULT=$(tail -1 run.log | grep -o '".*"' | sed 's/"//g')
          if [ -z "$RESULT" ]; then
            RESULT="签到完成，请查看日志"
          fi
        else
          RESULT="签到完成，但未找到日志文件"
        fi
        
        # 判断签到是否成功（包含"成功"或"已经签到"关键词）
        if echo "$RESULT" | grep -qE "成功|已经签到|ret.*0"; then
          TITLE=" 爱哭签签到成功"
          BODY="签到结果: ${RESULT}\n时间: $(date '+%Y-%m-%d %H:%M:%S')"
          LEVEL=""
        else
          TITLE=" 爱哭签签到失败"
          BODY="签到结果: ${RESULT}\n时间: $(date '+%Y-%m-%d %H:%M:%S')\n请及时检查！"
          LEVEL="&level=critical&volume=0"
        fi
        
        # 发送 Bark 推送
        echo " 发送 Bark 推送..."
        curl -X GET "https://api.day.app/${BARK_KEY}?title=${TITLE}&body=${BODY}${LEVEL}&sound=minimal&group=ikuun-checkin" \
          --connect-timeout 10 \
          --max-time 30
        echo ""
        echo " Bark 推送完成"
    - name: Commit # 上传日志到仓库
      env:
       NAME: ikuuu
       EMAIL: 1015350043@qq.com
      run: |
        git config --global user.name "$NAME"
        git config --global user.email "$EMAIL"
        git add .
        git commit -m "update log" -a || echo "无变更需要提交"
    - name: Push log
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: main
