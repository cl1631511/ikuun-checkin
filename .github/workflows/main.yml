name: 'kunkun Checkin Action'

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  checking:
    runs-on: ubuntu-latest
    env:
      DOMAIN: https://ikuuu.fy

    steps:
      - name: Setup timezone
        uses: zcong1993/setup-timezone@master
        with:
          timezone: Asia/Shanghai

      - name: Checkout code
        uses: actions/checkout@master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install playwright-extra puppeteer-extra-plugin-stealth playwright
          npx playwright install chromium --with-deps

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Login and sign in
        id: signin
        continue-on-error: true
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          xvfb-run --auto-servernum node login.js

          response=$(curl -b cookie.txt -s -X POST "$DOMAIN/user/checkin")
          echo "原始响应: $response"

          ret=$(echo "$response" | jq -r '.ret')
          msg=$(echo "$response" | jq -r '.msg')

          echo "ret=$ret" >> $GITHUB_OUTPUT
          echo "msg=$msg" >> $GITHUB_OUTPUT
          echo "response=$response" >> $GITHUB_OUTPUT

      - name: Bark Notification
        if: always()
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          if [ "${{ steps.signin.outcome }}" = "failure" ]; then
            TITLE="❌ iKuuu签到失败"
            BODY="登录失败，请检查以下问题：%0A- 域名是否正确？%0A- 账号密码是否有效？%0A- 极验验证码是否通过？%0A%0A时间: $(date '+%Y-%m-%d %H:%M:%S')"
            EXTRA="&level=critical&volume=0"
          else
            ret="${{ steps.signin.outputs.ret }}"
            msg="${{ steps.signin.outputs.msg }}"

            if [ "$ret" = "0" ]; then
              TITLE="✅ iKuuu签到成功"
              BODY="签到结果: ${msg}%0A时间: $(date '+%Y-%m-%d %H:%M:%S')"
              EXTRA=""
            else
              TITLE="❌ iKuuu签到失败"
              BODY="签到结果: ${msg}%0A时间: $(date '+%Y-%m-%d %H:%M:%S')%0A请及时检查！"
              EXTRA="&level=critical&volume=0"
            fi
          fi

          if [ -n "$BARK_KEY" ]; then
            echo "📤 发送 Bark 推送..."
            curl -s -G "https://api.day.app/${BARK_KEY}" \
              --data-urlencode "title=${TITLE}" \
              --data-urlencode "body=${BODY}" \
              --data-urlencode "sound=minimal" \
              --data-urlencode "group=ikuun-checkin" \
              ${EXTRA} \
              --connect-timeout 10 \
              --max-time 30
            echo ""
            echo "✅ Bark 推送完成"
          else
            echo "⏭️ 未设置 BARK_KEY，跳过 Bark 推送"
          fi
