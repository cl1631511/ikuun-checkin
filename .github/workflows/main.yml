name: 'kunkun Checkin Action'

on:
  schedule:
    - cron: '16 16 * * *'
  workflow_dispatch:

jobs:
  checking:
    runs-on: ubuntu-latest
    env:
      DOMAIN: https://ikuuu.foo

    steps:
      - name: Setup timezone
        uses: zcong1993/setup-timezone@master
        with:
          timezone: Asia/Shanghai

      - name: Checkout code
        uses: actions/checkout@master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install playwright-extra puppeteer-extra-plugin-stealth playwright
          npx playwright install chromium --with-deps

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Login and sign in
        id: signin
        continue-on-error: true
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          xvfb-run --auto-servernum node login.js

          response=$(curl -b cookie.txt -s -X POST "$DOMAIN/user/checkin")
          echo "原始响应: $response"

          ret=$(echo "$response" | jq -r '.ret')
          msg=$(echo "$response" | jq -r '.msg')

          echo "ret=$ret" >> $GITHUB_OUTPUT
          echo "msg=$msg" >> $GITHUB_OUTPUT

      - name: Bark Notification
        if: always()
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          # URL 编码函数
          urlencode() {
            echo "$1" | sed 's/ /%20/g;s/！/%EF%BC%81/g;s/？/%EF%BC%9F/g;s/，/%EF%BC%8C/g;s/：/%EF%BC%9A/g;s/；/%EF%BC%9B/g;s/“/%E2%80%9C/g;s/”/%E2%80%9D/g'
          }

          if [ "${{ steps.signin.outcome }}" = "failure" ]; then
            TITLE="iKuuu签到失败"
            BODY="登录失败，请检查：域名、账号、密码、验证码"
            EXTRA="?level=critical&volume=0"
          else
            ret="${{ steps.signin.outputs.ret }}"
            msg="${{ steps.signin.outputs.msg }}"

            if [ "$ret" = "0" ]; then
              TITLE="iKuuu签到成功"
              BODY="✅ ${msg} $(date '+%m-%d %H:%M')"
              EXTRA=""
            else
              TITLE="iKuuu签到失败"
              BODY="❌ ${msg} 请及时检查！"
              EXTRA="?level=critical&volume=0"
            fi
          fi

          # URL 编码标题和内容
          ENCODED_TITLE=$(urlencode "$TITLE")
          ENCODED_BODY=$(urlencode "$BODY")

          if [ -n "$BARK_KEY" ]; then
            echo "📤 发送 Bark 推送..."
            curl -s "https://api.day.app/${BARK_KEY}/${ENCODED_TITLE}/${ENCODED_BODY}${EXTRA}" \
              --connect-timeout 10 \
              --max-time 30
            echo ""
            echo "✅ Bark 推送完成"
          else
            echo "⏭️ 未设置 BARK_KEY，跳过 Bark 推送"
          fi
